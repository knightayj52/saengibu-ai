<!doctype html><html lang="ko"><meta charset="utf-8"><title>가상학생으로 입력 연습</title><link rel="stylesheet" href="demo.css"><body><main><p class="brand">영쌤클래스 · BETA</p><h1>가상학생으로 입력 연습</h1><p>실제 학생 정보와 나이스에 연결되지 않는 연습 화면입니다. 나이스에서의 호환성·저장 성공을 보증하는 테스트는 아닙니다.</p><div class="controls"><button id="reset">연습 초기화</button><button id="scan">① 화면 대조</button><button id="fill" disabled>② 빈칸 채우기</button></div><p>7번 다음에는 9번을 입력합니다. 8번은 대상에서 제외되어 있으며, 23번의 기존 문장은 보존합니다. 24번의 ‘(전입학)’ 표시는 이름과 구분합니다.</p><table><thead><tr><th>번호</th><th>이름</th><th>평가 문장</th></tr></thead><tbody id="students"></tbody></table><p id="result" role="status">화면 대조를 눌러 주세요.</p><p class="note">실제 사용: 나이스 입력칸 클릭 → 확장프로그램 열기 → 화면 대조 → 검토 확인 → 입력 → 나이스에서 직접 저장</p></main><script src="engine.js"></script><script src="demo.js"></script></body></html>
